<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Scena di prova WebGL 9:16</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #report { position: fixed; left: 6px; bottom: 6px; color: #9ff; font: 11px monospace;
            background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; margin: 0; white-space: pre; }
</style>
</head>
<body>
<pre id="report">avvio…</pre>
<script src="three.min.js"></script>
<script>
(function () {
  // ---- probe WebGL prima di tutto
  function infoGL() {
    try {
      // canvas SEPARATI: dopo un contesto webgl2, getContext("webgl") sullo
      // stesso canvas torna sempre null (bug della prima versione della sonda)
      const gl2 = !!document.createElement("canvas").getContext("webgl2");
      const c = document.createElement("canvas");
      const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if (!gl) return { webgl: false, webgl2: gl2, renderer: "n/d" };
      const ext = gl.getExtension("WEBGL_debug_renderer_info");
      const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      return { webgl: true, webgl2: gl2, renderer: String(renderer) };
    } catch (e) { return { webgl: false, webgl2: false, renderer: "ERRORE: " + e.message }; }
  }
  const INFO = infoGL();
  window.__PROBE = Object.assign({}, INFO, { fps: 0, pixelNonNeri: 0, campioni: 0 });

  if (!INFO.webgl) {
    document.getElementById("report").textContent = "WEBGL NON DISPONIBILE: " + INFO.renderer;
    return;
  }

  // ---- scena three.js 9:16 (verticale, come i giochi TikTok)
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, .1, 100);
  camera.position.set(0, 1.6, 6);
  const scena = new THREE.Scene();
  scena.fog = new THREE.FogExp2(0x05070f, .06);

  // stelle
  const pos = [];
  for (let i = 0; i < 900; i++) {
    pos.push((Math.random() - .5) * 60, (Math.random() - .5) * 60, (Math.random() - .5) * 60);
  }
  const geoStelle = new THREE.BufferGeometry();
  geoStelle.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  scena.add(new THREE.Points(geoStelle, new THREE.PointsMaterial({ color: 0x9fd8ff, size: .12 })));

  // pavimento grigliato
  const pav = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x14243a, roughness: .9, metalness: .1 }));
  pav.rotation.x = -Math.PI / 2; scena.add(pav);

  // oggetti animati: 4 cubi + nodo torus
  const cubi = [];
  const colori = [0xff5757, 0xffd166, 0x63e6a4, 0x6ba8ff];
  for (let i = 0; i < 4; i++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(.9, .9, .9),
      new THREE.MeshStandardMaterial({ color: colori[i], roughness: .35, metalness: .25 }));
    c.position.set(Math.cos(i * Math.PI / 2) * 2, 1 + (i % 2) * .8, Math.sin(i * Math.PI / 2) * 2);
    c.userData.omega = .6 + i * .25;
    scena.add(c); cubi.push(c);
  }
  const nodo = new THREE.Mesh(new THREE.TorusKnotGeometry(.65, .22, 128, 24),
    new THREE.MeshStandardMaterial({ color: 0xf0c75e, roughness: .25, metalness: .6 }));
  nodo.position.set(0, 2.4, 0); scena.add(nodo);

  scena.add(new THREE.AmbientLight(0x8899bb, .5));
  const luce = new THREE.PointLight(0xffe9c9, 1.4, 30);
  luce.position.set(3, 5, 3); scena.add(luce);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ---- loop + statistiche
  let frame = 0, t0 = performance.now(), fps = 0;
  function tick() {
    frame++;
    const t = (performance.now() - t0) / 1000;
    cubi.forEach((c, i) => {
      c.rotation.x = t * c.userData.omega;
      c.rotation.y = t * c.userData.omega * 1.3;
      c.position.y = 1 + Math.sin(t * 1.2 + i) * .5;
    });
    nodo.rotation.x = t * .8; nodo.rotation.y = t * .5;
    luce.position.set(Math.sin(t) * 4, 5, Math.cos(t) * 4);
    camera.position.x = Math.sin(t * .3) * .8;
    camera.lookAt(0, 1.5, 0);
    renderer.render(scena, camera);
    if (frame % 30 === 0) {
      const dt = (performance.now() - t0) / 1000;
      fps = frame / dt;
      aggiornaReport(fps);
    }
    requestAnimationFrame(tick);
  }

  function aggiornaReport(fps) {
    try {
      const gl = renderer.getContext();
      const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
      const px = new Uint8Array(4 * 400);
      // campiono una griglia 20x20 in mezzo allo schermo
      const passo = 20; let nonNeri = 0, tot = 0;
      for (let y = 0; y < 20; y++) for (let x = 0; x < 20; x++) {
        gl.readPixels(Math.floor((x + .5) * w / 20 / passo) * passo, Math.floor((y + .5) * h / 20 / passo) * passo, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px, (y * 20 + x) * 4);
        tot++;
        if (px[(y * 20 + x) * 4] + px[(y * 20 + x) * 4 + 1] + px[(y * 20 + x) * 4 + 2] > 30) nonNeri++;
      }
      window.__PROBE.fps = Math.round(fps);
      window.__PROBE.pixelNonNeri = nonNeri;
      window.__PROBE.campioni = tot;
      window.__PROBE.risoluzione = w + "x" + h;
      document.getElementById("report").textContent =
        `WebGL ${INFO.webgl2 ? "2" : "1"} OK · ${INFO.renderer}\nFPS: ${Math.round(fps)} · pixel non-neri: ${nonNeri}/${tot} · ${w}x${h}`;
    } catch (e) {
      document.getElementById("report").textContent = "probe err: " + e.message;
    }
  }
  tick();
})();
</script>
</body>
</html>
